modules:
  jira:issueContext:
    - key: stand-note-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Stand note
      label: Where the work stands
  rovo:mcp:
    - key: stand-note-mcp
      name: Stand Note
      tools:
        - save-stand-note
  action:
    - key: save-stand-note
      name: Save stand note
      function: save-stand-note-fn
      actionVerb: UPDATE
      description: >-
        Saves the stand note of a Jira ticket, so that a teammate or their agent can carry on.
        The save replaces the whole note: send each field that is still true. Call it after
        each finished step, and before the session stops.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira ticket key, such as PAY-142.
        done:
          title: Done
          type: string
          required: false
          description: What is finished. 1,000 characters at most.
        next:
          title: Next
          type: string
          required: false
          description: The next step. 1,000 characters at most.
        watchOut:
          title: Watch out
          type: string
          required: false
          description: Traps, and what you tried that failed. 1,000 characters at most.
        code:
          title: Code
          type: string
          required: false
          description: The branch name, or a link to the code. 1,000 characters at most.
  function:
    - key: resolver
      handler: index.handler
    - key: save-stand-note-fn
      handler: index.saveStandNote
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/62f3c556-f63e-43bf-9033-8c2d41e14c00
