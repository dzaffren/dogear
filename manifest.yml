modules:
  jira:issueContext:
    - key: stand-note-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Dogear
      label: Where the work stands
      icon: resource:icons;dogear.svg
  jira:projectPage:
    - key: stand-notes-page
      resource: at-risk
      resolver:
        function: resolver
      render: native
      title: Dogears
      icon: resource:icons;dogear.svg
  llm:
    - key: brief-llm
      model:
        - claude
  rovo:mcp:
    - key: stand-note-mcp
      name: Dogear
      tools:
        - get-dogear
        - save-dogear
  action:
    - key: get-dogear
      name: Get dogear
      function: get-dogear-fn
      actionVerb: GET
      description: >-
        Reads the dogear of a Jira ticket. A dogear is a short note that says what is done,
        what is next, what to watch out for, and where the code is. Call it when work on a
        ticket starts, and before each save.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira ticket key, such as PAY-142.
    - key: save-dogear
      name: Save dogear
      function: save-dogear-fn
      actionVerb: UPDATE
      description: >-
        Saves the dogear of a Jira ticket, so that a teammate or their agent can carry on. A
        dogear is a short note: Done, Next, Watch out, Code. The save replaces the whole
        dogear: send each field that is still true. Call it after each step, and before you
        stop.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira ticket key, such as PAY-142.
        done:
          title: Done
          type: string
          required: false
          description: What is finished. 1,000 characters at most.
        next:
          title: Next
          type: string
          required: false
          description: The next step. 1,000 characters at most.
        watchOut:
          title: Watch out
          type: string
          required: false
          description: Traps, and what you tried that failed. 1,000 characters at most.
        code:
          title: Code
          type: string
          required: false
          description: The branch name, or a link to the code. 1,000 characters at most.
  function:
    - key: resolver
      handler: index.handler
    - key: get-dogear-fn
      handler: index.getDogear
    - key: save-dogear-fn
      handler: index.saveDogear
resources:
  - key: main
    path: src/frontend/index.jsx
  - key: at-risk
    path: src/frontend/at-risk.jsx
  - key: icons
    path: static/icons
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/62f3c556-f63e-43bf-9033-8c2d41e14c00
