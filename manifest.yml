modules:
  jira:issueContext:
    - key: stand-note-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Stand note
      label: Where the work stands
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/62f3c556-f63e-43bf-9033-8c2d41e14c00
